algo:
  _convert_: all
  _target_: sb3.RatioStatsPPO
  policy: MlpPolicy
  policy_kwargs:
    ortho_init: true
    activation_fn:
      _target_: hydra.utils.get_class
      path: torch.nn.ReLU
    net_arch:
      pi:
      - 256
      - 256
      vf:
      - 256
      - 256
    log_std_init: 0.0
  batch_size: 32
  gae_lambda: 0.99
  n_steps: 512
  gamma: 0.999
  n_epochs: 5
  ent_coef: 0.00229519
  learning_rate: 9.808e-05
  clip_range: 0.2
  max_grad_norm: 0.7
  vf_coef: 0.835671
  normalize_advantage: true
  device: cpu
  seed: 8
env:
  _target_: sb3.env_factory.create_mujoco_env
  env_id: Hopper-v4
  n_envs: 1
  render_mode: rgb_array
  seed: ${training.seed}
wandb:
  project: BPO-calib-mujoco
  entity: null
  monitor_gym: true
  save_code: true
  name: Hopper-v4-ppo-s8
  group: Hopper-v4-ppo
training:
  total_timesteps: 2000000
  gradient_save_freq: 100000
  n_envs: 8
  seed: 8
