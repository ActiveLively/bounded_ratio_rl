algo:
  _convert_: all
  _target_: sb3.BPO
  policy: BPOPolicy
  policy_kwargs:
    ortho_init: true
    activation_fn:
      _target_: hydra.utils.get_class
      path: torch.nn.ReLU
    net_arch:
      pi:
      - 256
      - 256
      vf:
      - 256
      - 256
    log_std_init: 0.0
  learning_rate: 9.808e-05
  batch_size: 32
  n_steps: 512
  n_epochs: 10
  gamma: 0.999
  gae_lambda: 0.95
  lambda_: 10.0
  ent_coef: 0.0
  vf_coef: 0.5
  u_coef: 0.5
  clip_ratio: 0.25
  verbose: 1
  max_grad_norm: 1.0
  use_median: true
  device: cpu
  seed: 4
env:
  _target_: sb3.env_factory.create_mujoco_env
  env_id: Hopper-v4
  n_envs: 4
  render_mode: rgb_array
  seed: ${training.seed}
wandb:
  project: BPO-calib-mujoco
  entity: null
  monitor_gym: true
  save_code: true
  name: Hopper-v4-bpo-s4
  group: Hopper-v4-bpo
training:
  total_timesteps: 2000000
  gradient_save_freq: 100000
  n_envs: 8
  seed: 4
