algo:
  _convert_: all
  _target_: stable_baselines3.DQN
  policy: CnnPolicy
  buffer_size: 100000
  learning_rate: 0.0001
  seed: ${training.seed}
  verbose: 1
  batch_size: 32
  learning_starts: 100000
  target_update_interval: 1000
  train_freq: 4
  gradient_steps: 1
  exploration_fraction: 0.1
  exploration_final_eps: 0.01
  optimize_memory_usage: false
  device: cpu
env:
  _target_: sb3.env_factory.create_atari_env
  env_id: AsterixNoFrameskip-v4
  n_envs: 1
  n_stack: 4
  seed: ${training.seed}
wandb:
  project: BPO-repro-atari
  entity: null
  monitor_gym: true
  save_code: true
  name: AsterixNoFrameskip-v4-dqn-s3
  group: AsterixNoFrameskip-v4-dqn
training:
  total_timesteps: 40000000
  gradient_save_freq: 100000
  n_envs: 8
  seed: 3
  max_hours: 48.0
