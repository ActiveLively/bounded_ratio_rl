algo:
  _convert_: all
  _target_: sb3.RatioStatsPPO
  policy: MlpPolicy
  policy_kwargs:
    ortho_init: true
    activation_fn:
      _target_: hydra.utils.get_class
      path: torch.nn.ReLU
    net_arch:
      pi:
      - 256
      - 256
      vf:
      - 256
      - 256
    log_std_init: 0.0
  batch_size: 256
  gae_lambda: 0.9
  n_steps: 512
  gamma: 0.98
  n_epochs: 5
  ent_coef: 0.00238306
  learning_rate: 3.56987e-05
  clip_range: 0.3
  max_grad_norm: 2.0
  vf_coef: 0.431892
  normalize_advantage: true
  device: cpu
  seed: 4
env:
  _target_: sb3.env_factory.create_mujoco_env
  env_id: Humanoid-v4
  n_envs: 1
  render_mode: rgb_array
  seed: ${training.seed}
wandb:
  project: BPO-repro-mujoco
  entity: null
  monitor_gym: true
  save_code: true
  name: Humanoid-v4-ppo-s4
  group: Humanoid-v4-ppo
training:
  total_timesteps: 40000000
  gradient_save_freq: 100000
  n_envs: 8
  seed: 4
  max_hours: null
  resume: null
