defaults:
  - algo: bpo/atari
  - env: atari
  - _self_

wandb:
  project: BPO
  entity: null  # null = your wandb default entity
  monitor_gym: true
  save_code: true

training:
  total_timesteps: 40_000_000
  gradient_save_freq: 100_000
  n_envs: 8
  seed: 42
  max_hours: null  # optional wall-clock cap per run
  resume: null  # wandb run id: continue that run from its saved model up to total_timesteps
